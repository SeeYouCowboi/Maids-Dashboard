name: Test & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Dashboard
        uses: actions/checkout@v4
        with:
          path: Maids-Dashboard

      - name: Read MaidsClaw version
        id: mc_ver
        run: |
          SHA=$(cat Maids-Dashboard/.maidsclaw-version)
          if [ -z "$SHA" ]; then
            echo "ERROR: .maidsclaw-version is empty or missing"
            exit 1
          fi
          echo "sha=$SHA" >> $GITHUB_OUTPUT

      - name: Checkout MaidsClaw (pinned)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/MaidsClaw
          ref: ${{ steps.mc_ver.outputs.sha }}
          path: MaidsClaw
          token: ${{ secrets.MAIDSCLAW_REPO_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        working-directory: Maids-Dashboard
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: Maids-Dashboard
        run: bun run typecheck

      - name: Lint
        working-directory: Maids-Dashboard
        run: bun run lint

      - name: Test
        working-directory: Maids-Dashboard
        run: bun run test

      - name: Build
        working-directory: Maids-Dashboard
        run: bun run build

      - name: Configure SSH
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy static dist/
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            Maids-Dashboard/dist/ \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/var/www/maids-dashboard/"
